name: Sincronizar Meta Ads e publicar dashboard

on:
  schedule:
    - cron: "17 */3 * * *"
  # Publica de novo sempre que o código do dashboard muda em main
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - scripts/**
      - .github/workflows/sync-meta.yml
  workflow_dispatch:
    inputs:
      demo:
        description: Publicar com dados fictícios
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dashboard-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A primeira carga do histórico completo (37 meses) leva uns 15 min; as seguintes usam o cache.
    timeout-minutes: 60
    env:
      # Cache incremental só liga quando o secret CACHE_KEY existe. O repositório é público,
      # então o cache fica sempre cifrado (scripts/cache-crypto.mjs).
      USE_CACHE: ${{ secrets.CACHE_KEY != '' && inputs.demo != true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O deploy --prebuilt lê as configurações do projeto em .vercel/project.json,
      # que só o "vercel pull" cria. Roda antes de montar .vercel/output.
      - name: Vincular projeto da Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN no GitHub Actions}"
          : "${VERCEL_ORG_ID:?Configure VERCEL_ORG_ID no GitHub Actions}"
          : "${VERCEL_PROJECT_ID:?Configure VERCEL_PROJECT_ID no GitHub Actions}"
          npx --yes vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN"
          test -f .vercel/project.json

      - name: Restaurar cache cifrado da última sincronização
        if: ${{ env.USE_CACHE == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/insights.enc
          key: meta-insights-v1-${{ github.run_id }}
          restore-keys: meta-insights-v1-

      - name: Abrir cache
        if: ${{ env.USE_CACHE == 'true' }}
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: |
          if [ -f .cache/insights.enc ]; then
            node scripts/cache-crypto.mjs decrypt .cache/insights.enc .cache/prev.json
          else
            echo "• Nenhum cache salvo ainda: esta execução baixa o histórico completo."
          fi

      - name: Buscar dados da Meta Marketing API
        if: ${{ inputs.demo != true }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          DAYS: ${{ vars.DAYS || '1200' }}
          REFRESH_DAYS: ${{ vars.REFRESH_DAYS || '28' }}
          MAX_DAYS: ${{ vars.MAX_DAYS || '3650' }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v23.0' }}
          LEAD_ACTION_TYPES: ${{ vars.LEAD_ACTION_TYPES }}
          PREV: .cache/prev.json
          OUT: build/insights.json
        run: |
          mkdir -p "$(dirname "$OUT")"
          node scripts/fetch-meta.mjs

      - name: Cifrar cache
        if: ${{ env.USE_CACHE == 'true' }}
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: |
          rm -f .cache/insights.enc .cache/prev.json
          node scripts/cache-crypto.mjs encrypt build/insights.json .cache/insights.enc

      - name: Salvar cache cifrado
        if: ${{ env.USE_CACHE == 'true' && hashFiles('.cache/insights.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/insights.enc
          key: meta-insights-v1-${{ github.run_id }}

      # Arquivos estáticos (sem função): o JSON do histórico completo passa do limite
      # de 4,5 MB por resposta das funções da Vercel. Os cabeçalhos noindex vêm das rotas.
      - name: Montar o dashboard
        run: |
          out=.vercel/output
          mkdir -p "$out/static"
          cp -r index.html assets "$out/static/"
          printf 'User-agent: *\nDisallow: /\n' > "$out/static/robots.txt"
          # Dados em partes mensais: o dashboard baixa só os meses do período visto
          if [ -f build/insights.json ]; then node scripts/split-data.mjs build/insights.json "$out/static/data"; fi
          cat > "$out/config.json" <<'JSON'
          {"version":3,"routes":[
            {"src":"/(.*)","headers":{"X-Robots-Tag":"noindex, nofollow, noarchive","X-Content-Type-Options":"nosniff","Cache-Control":"public, max-age=0, must-revalidate"},"continue":true},
            {"src":"/data/chunks/(.*)","headers":{"Cache-Control":"public, max-age=31536000, immutable"},"continue":true},
            {"handle":"filesystem"},
            {"src":"/(.*)","status":404}
          ]}
          JSON
          node -e "JSON.parse(require('fs').readFileSync('$out/config.json','utf8'))"
          ls -la "$out/static" "$out/static/data" 2>/dev/null || true

      - name: Publicar na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@48 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "Dashboard: $url" >> "$GITHUB_STEP_SUMMARY"
